# Merge only the sections you need into ~/.codex/config.toml and replace with your local paths.
[mcp_servers.unity_mcp]
command = "C:/Program Files/nodejs/node.exe"
args = ["C:/Tools/unity-mcp-server/src/index.js"]

[mcp_servers.blender]
command = "C:/Tools/uv/uvx.exe"
args = ["mcp-for-blender==2.3.1"]

[mcp_servers.blender.env]
BLENDER_MCP_SAFE_MODE = "1"
DISABLE_TELEMETRY = "true"
