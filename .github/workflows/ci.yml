name: Toolkit QA & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for texture tool tests
        run: python -m pip install --upgrade pip pillow

      - name: Validate skill metadata, markdown links, privacy hygiene, and Python syntax
        run: python -X utf8 scripts/validate_toolkit.py

      - name: Run unit tests
        run: python -X utf8 -m unittest discover -s tests -v

      - name: Verify skill packaging
        run: python -X utf8 scripts/package_skills.py

      - name: Smoke-test environment doctor
        run: python -X utf8 scripts/doctor.py --json
